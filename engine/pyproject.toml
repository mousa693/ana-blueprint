[project]
name = "ana-engine"
version = "0.1.0"
description = "ANA — Adaptive Neural-Simulation Architecture: a living recursive simulation of self (Identity Core ⇄ Environment Mirror)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",      # used by the MCMG memory core (TF-IDF embeddings)
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]   # optional: the generative engine runs offline without it
dev = ["pytest>=8.0"]

[project.scripts]
ana-run = "ana.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ana*"]
