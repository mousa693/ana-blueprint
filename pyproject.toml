[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ana"
version = "0.1.0"
description = "ANA v2: an autonomous digital twin"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "pydantic>=2.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ana*"]

[tool.setuptools.package-data]
"ana.genesis" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
