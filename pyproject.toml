[project]
name = "ana-engine"
version = "0.1.0"
description = "ANA — Adaptive Neural-Simulation Architecture: a living recursive simulation of self (Identity Core ⇄ Environment Mirror)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",      # used by the MCMG memory core (TF-IDF embeddings)
    # web product (ana/app) — docs/PRODUCT_SPEC.md §3
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.1",
    # dev journey viewer (ana/web, `python -m ana.web`): multipart run-log uploads
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]   # 1.x (httpx2-based) — the mocked-transport tests rely on it   # optional: the generative engine runs offline without it
postgres = ["psycopg[binary]>=3.1"]   # ANA_DATABASE_URL=postgresql://...
# test deps: fastapi's TestClient (starlette) and the mocked-transport LLM tests
# use httpx2; httpx is kept for older starlette releases.
dev = ["pytest>=8.0", "httpx2>=2.0", "httpx>=0.27"]

[project.scripts]
ana-run = "ana.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ana*"]

# Ship the web UIs with a non-editable install (wheel / Docker image).
[tool.setuptools.package-data]
"ana.app" = ["static/*", "static/**/*"]
"ana.web" = ["static/*", "static/**/*"]
