<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'">
  <meta name="referrer" content="same-origin">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14151a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="ANA — a quiet, symbolic story that mirrors your inner life.">
  <title>ANA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23485487' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23b07d1c'/%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar" id="topbar">
    <a class="wordmark" href="#/" aria-label="ANA — home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12"/><circle cx="16" cy="16" r="4"/></svg>
      <span>ANA</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main" hidden>
      <a href="#/home" data-route="home">Home</a>
      <a href="#/settings" data-route="settings">Settings</a>
    </nav>
  </header>

  <main id="view" class="view" tabindex="-1" aria-live="off">
    <noscript><p class="noscript">ANA needs JavaScript to tell its story.</p></noscript>
  </main>

  <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
  <div id="overlay-root"></div>

  <dialog id="confirm" class="dialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <form method="dialog" class="dialog-inner">
      <h2 id="confirm-title" class="dialog-title"></h2>
      <p id="confirm-body" class="dialog-body"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-quiet" id="confirm-cancel">Not yet</button>
        <button value="ok" class="btn btn-primary" id="confirm-ok">Confirm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
