name: ANA engine CI

on:
  push:
    paths: ["engine/**", ".github/workflows/engine-ci.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine-ci.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: engine

jobs:
  tests:
    name: Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm,postgres]"

      - name: Pytest
        run: python -m pytest tests -q

  image:
    name: Docker image + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: engine
          load: true
          tags: ana:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: docker image inspect ana:ci --format 'ana:ci {{.Size}} bytes'

      - name: Run container
        run: |
          docker volume create ana-ci-data
          docker run -d --name ana-ci -p 127.0.0.1:8000:8000 -v ana-ci-data:/data \
            -e ANA_SECRET_KEY="$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" \
            ana:ci
          for i in $(seq 1 45); do
            status="$(docker inspect -f '{{.State.Health.Status}}' ana-ci)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "health: $status"
          test "$status" = healthy

      - name: Smoke test
        run: bash scripts/smoke.sh http://127.0.0.1:8000

      - name: Restart (same volume) and smoke again
        run: |
          docker restart ana-ci
          for i in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ana-ci)" = healthy ] && break
            sleep 2
          done
          bash scripts/smoke.sh http://127.0.0.1:8000

      - name: Container logs
        if: always()
        run: docker logs ana-ci 2>&1 | tail -200

      - name: Clean up
        if: always()
        run: |
          docker rm -f ana-ci || true
          docker volume rm ana-ci-data || true
